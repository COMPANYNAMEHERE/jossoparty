  <title>feestje</title>
  <link rel="icon" type="image/png" href="Images/pictogram.png" />
  <link rel="apple-touch-icon" href="Images/pictogram.png" />
  <script>
    (function () {
      if (location.protocol !== "file:") return;
      var ports = [4174, 3000, 3001, 5173, 8080];
      var fallback = setTimeout(function () {
        document.documentElement.className += " needs-server";
      }, 900);

      function tryPort(index) {
        if (index >= ports.length) return;
        var url = "http://localhost:" + ports[index] + "/";
        fetch(url, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            clearTimeout(fallback);
            location.replace(url);
          })
          .catch(function () {
            tryPort(index + 1);
          });
      }

      tryPort(0);
    }());
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
